<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Active Brain // Persistent Second Brain</title>
  <meta name="theme-color" content="#070a12" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#070a12',
            surfaceDark: '#0f172a',
            surfaceBorder: '#1e293b',
            neonCyan: '#06b6d4',
            neonPink: '#f43f5e',
          }
        }
      }
    }
  </script>
  <style>
    /* Dark Theme Base */
    html.dark body {
      background-color: #070a12;
      background-image: 
        radial-gradient(at 10% 20%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(244, 63, 94, 0.08) 0px, transparent 50%);
      color: #f1f5f9;
    }
    html.dark .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Light Theme Base */
    html:not(.dark) body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 10% 20%, rgba(6, 182, 212, 0.06) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(244, 63, 94, 0.06) 0px, transparent 50%);
      color: #0f172a;
    }
    html:not(.dark) .glass-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
  </style>
</head>
<body class="p-3 sm:p-6 pb-24 max-w-4xl mx-auto selection:bg-neonCyan selection:text-black">

  <!-- HEADER -->
  <header class="flex flex-wrap justify-between items-center gap-3 mb-6">
    <div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-neonCyan shadow-[0_0_8px_#06b6d4]"></span>
        <h1 class="text-xl sm:text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-neonCyan via-indigo-400 to-neonPink">
          ACTIVE BRAIN
        </h1>
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Второй мозг с неотвратимыми напоминаниями</p>
    </div>
    
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Theme Switcher -->
      <button id="themeToggleBtn" title="Переключить тему" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-surfaceDark border border-slate-300 dark:border-surfaceBorder hover:border-neonCyan transition text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Ночь</span>
      </button>

      <!-- Backup / Restore -->
      <button id="exportBtn" title="Скачать JSON бэкап" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-surfaceDark border border-slate-300 dark:border-surfaceBorder hover:border-neonCyan transition text-slate-700 dark:text-slate-300">
        ↓ Бэкап
      </button>
      <label for="importInput" title="Загрузить JSON копию" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-surfaceDark border border-slate-300 dark:border-surfaceBorder hover:border-neonCyan transition text-slate-700 dark:text-slate-300 cursor-pointer">
        ↑ Импорт
        <input type="file" id="importInput" accept=".json" class="hidden" />
      </label>

      <!-- Push Notification Toggle -->
      <button id="notifyBtn" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-surfaceDark border border-slate-300 dark:border-surfaceBorder hover:border-neonCyan transition flex items-center gap-1.5 text-slate-700 dark:text-slate-300">
        <span id="notifyDot" class="w-2 h-2 rounded-full bg-amber-500"></span>
        <span id="notifyStatus">Пуши выкл</span>
      </button>
    </div>
  </header>

  <!-- QUICK CAPTURE SECTION -->
  <section class="glass-panel rounded-2xl p-4 sm:p-6 mb-6 shadow-2xl relative overflow-hidden">
    <div class="flex flex-col gap-3">
      <div class="relative">
        <textarea 
          id="thoughtInput" 
          rows="3" 
          placeholder="«Позвонить Тимуру завтра в 15:00 по поводу сайта #клиенты» или надиктуй..." 
          class="w-full bg-slate-100 dark:bg-slate-900/90 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 rounded-xl p-3.5 pr-14 text-sm sm:text-base border border-slate-300 dark:border-surfaceBorder focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition resize-none shadow-inner"
        ></textarea>
        
        <button 
          id="micBtn" 
          title="Голосовой ввод"
          class="absolute right-3 top-3 w-10 h-10 rounded-full flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-neonCyan border border-cyan-500/40 hover:scale-105 active:scale-95 transition"
        >
          <svg id="micIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>

      <!-- Realtime NLP Extraction Preview -->
      <div id="parsePreview" class="hidden text-xs py-1.5 px-3 rounded-lg bg-slate-200/80 dark:bg-slate-900/60 border border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 flex flex-wrap gap-2 items-center">
        <span class="text-slate-500 font-mono">Анализ:</span>
        <span id="previewType" class="px-1.5 py-0.5 rounded bg-cyan-100 dark:bg-cyan-950 text-cyan-800 dark:text-neonCyan font-bold">Задача</span>
        <span id="previewDate" class="text-amber-600 dark:text-amber-400 font-medium"></span>
        <span id="previewTags" class="text-pink-600 dark:text-pink-400 font-mono"></span>
      </div>

      <div class="flex items-center justify-between pt-1">
        <span class="text-[11px] text-slate-400 hidden sm:inline">Ctrl + Enter для мгновенной отправки</span>
        <button 
          id="saveBtn" 
          class="w-full sm:w-auto ml-auto px-6 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-neonCyan to-cyan-600 hover:from-cyan-400 hover:to-neonCyan text-slate-950 shadow-lg shadow-cyan-500/20 active:scale-95 transition flex items-center justify-center gap-2"
        >
          <span>Зафиксировать</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- NAVIGATION TABS -->
  <div class="flex border-b border-slate-300 dark:border-surfaceBorder gap-4 mb-5">
    <button id="tabUrgent" class="pb-3 font-bold text-sm tracking-wide border-b-2 border-neonPink text-neonPink flex items-center gap-2 transition">
      <span>🔥 Сегодня & Дедлайны</span>
      <span id="urgentBadge" class="bg-pink-100 dark:bg-pink-950 text-pink-700 dark:text-neonPink px-2 py-0.2 rounded-full text-xs border border-pink-500/30">0</span>
    </button>
    <button id="tabAll" class="pb-3 font-medium text-sm tracking-wide border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 flex items-center gap-2 transition">
      <span>💡 Все мысли & База</span>
      <span id="allBadge" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-0.2 rounded-full text-xs">0</span>
    </button>
  </div>

  <!-- SEARCH & TAG CHIPS HUB -->
  <div class="mb-5 space-y-2.5">
    <div class="relative">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Поиск по тексту, имени или #тегу..." 
        class="w-full bg-slate-100 dark:bg-slate-900/80 border border-slate-300 dark:border-surfaceBorder rounded-xl py-2.5 pl-9 pr-3 text-xs sm:text-sm text-slate-900 dark:text-slate-200 outline-none focus:border-neonCyan transition"
      />
      <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>
    <div id="tagsList" class="flex flex-wrap gap-1.5 pt-0.5"></div>
  </div>

  <!-- LIST CONTAINERS -->
  <main>
    <div id="urgentContainer" class="space-y-3"></div>
    <div id="ideasContainer" class="hidden space-y-3"></div>
    
    <!-- INTERACTIVE EMPTY STATE WITH ONBOARDING PRESETS -->
    <div id="emptyState" class="hidden py-8 px-4 rounded-2xl glass-panel text-center">
      <div class="w-12 h-12 rounded-full bg-cyan-500/10 text-neonCyan flex items-center justify-center mx-auto mb-3 text-xl font-black">
        ⚡
      </div>
      <h3 class="text-base font-bold text-slate-800 dark:text-slate-200 mb-1">Здесь начинается порядок в голове</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto mb-5">
        Нажмите на любой шаблон ниже, чтобы протестировать распознавание дедлайнов и тегов:
      </p>

      <div class="grid sm:grid-cols-3 gap-2.5 max-w-2xl mx-auto text-left">
        <button class="preset-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-neonCyan transition group" data-sample="Позвонить Тимуру завтра в 15:00 по сайту #клиенты">
          <span class="text-[10px] uppercase font-bold text-neonCyan block mb-1">Задача с дедлайном</span>
          <span class="text-xs font-medium text-slate-700 dark:text-slate-300 group-hover:text-neonCyan transition">Позвонить Тимуру завтра в 15:00 #клиенты</span>
        </button>

        <button class="preset-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-neonPink transition group" data-sample="Идея: Телеграм-бот на Python для автопостинга #стартап">
          <span class="text-[10px] uppercase font-bold text-neonPink block mb-1">Вспышка идеи</span>
          <span class="text-xs font-medium text-slate-700 dark:text-slate-300 group-hover:text-neonPink transition">Идея: Бот на Python для автопостинга #стартап</span>
        </button>

        <button class="preset-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-amber-400 transition group" data-sample="Оплатить хостинг и домен через 30 минут #деньги">
          <span class="text-[10px] uppercase font-bold text-amber-500 block mb-1">Быстрый таймер</span>
          <span class="text-xs font-medium text-slate-700 dark:text-slate-300 group-hover:text-amber-400 transition">Оплатить хостинг через 30 минут #деньги</span>
        </button>
      </div>
    </div>
  </main>

  <!-- APP ENGINE SCRIPT -->
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'active_brain_notes_v2';
      const THEME_KEY = 'active_brain_theme';

      let notes = [];
      let currentTab = 'urgent';
      let activeTagFilter = null;
      let recognition = null;
      let isRecording = false;

      // DOM Elements
      const thoughtInput = document.getElementById('thoughtInput');
      const micBtn = document.getElementById('micBtn');
      const saveBtn = document.getElementById('saveBtn');
      const tabUrgent = document.getElementById('tabUrgent');
      const tabAll = document.getElementById('tabAll');
      const urgentBadge = document.getElementById('urgentBadge');
      const allBadge = document.getElementById('allBadge');
      const urgentContainer = document.getElementById('urgentContainer');
      const ideasContainer = document.getElementById('ideasContainer');
      const emptyState = document.getElementById('emptyState');
      const notifyBtn = document.getElementById('notifyBtn');
      const notifyDot = document.getElementById('notifyDot');
      const notifyStatus = document.getElementById('notifyStatus');
      const parsePreview = document.getElementById('parsePreview');
      const previewType = document.getElementById('previewType');
      const previewDate = document.getElementById('previewDate');
      const previewTags = document.getElementById('previewTags');
      const searchInput = document.getElementById('searchInput');
      const tagsList = document.getElementById('tagsList');
      const exportBtn = document.getElementById('exportBtn');
      const importInput = document.getElementById('importInput');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');

      // --- THEME ENGINE ---
      function initTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
        applyTheme(savedTheme);
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          themeIcon.textContent = '🌙';
          themeText.textContent = 'Ночь';
        } else {
          document.documentElement.classList.remove('dark');
          themeIcon.textContent = '☀️';
          themeText.textContent = 'День';
        }
        localStorage.setItem(THEME_KEY, theme);
      }

      themeToggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.contains('dark');
        applyTheme(isDark ? 'light' : 'dark');
      });

      // --- STORAGE MODULE ---
      function loadNotes() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          notes = raw ? JSON.parse(raw) : [];
        } catch (e) {
          notes = [];
        }
      }

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        render();
      }

      // --- NATURAL LANGUAGE PARSER ---
      function parseContent(rawText) {
        const text = rawText.trim();
        if (!text) return null;

        let detectedType = 'note';
        let dueAt = null;
        let tags = [];

        // 1. Хэштеги
        const hashtagMatches = text.match(/#[\p{L}0-9_-]+/gu);
        if (hashtagMatches) {
          tags = hashtagMatches.map(t => t.toLowerCase());
        }

        const lower = text.toLowerCase();
        if (/(сайт|макет|клиент|заказчик|тимур)/.test(lower) && !tags.includes('#клиенты')) tags.push('#клиенты');
        if (/(деньги|оплат|счет|долг|карта|сум)/.test(lower) && !tags.includes('#деньги')) tags.push('#деньги');
        if (/(проект|стартап|бот|сервис)/.test(lower) && !tags.includes('#стартап')) tags.push('#стартап');

        // 2. Дедлайны
        const now = new Date();
        let targetDate = new Date(now.getTime());
        let hasTime = false;

        if (/послезавтра/i.test(lower)) {
          targetDate.setDate(targetDate.getDate() + 2);
          hasTime = true;
        } else if (/завтра/i.test(lower)) {
          targetDate.setDate(targetDate.getDate() + 1);
          hasTime = true;
        } else if (/сегодня/i.test(lower)) {
          hasTime = true;
        }

        const inMin = lower.match(/через\s+(\d+)\s+мин/i);
        const inHours = lower.match(/через\s+(\d+)\s+час/i);
        if (inMin) {
          targetDate = new Date(now.getTime() + parseInt(inMin[1], 10) * 60000);
          hasTime = true;
        } else if (inHours) {
          targetDate = new Date(now.getTime() + parseInt(inHours[1], 10) * 3600000);
          hasTime = true;
        }

        const timeMatch = lower.match(/(?:в|к)\s+(\d{1,2})(?::(\d{2}))?/i);
        if (timeMatch) {
          const hours = parseInt(timeMatch[1], 10);
          const minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
          if (hours >= 0 && hours < 24) {
            targetDate.setHours(hours, minutes, 0, 0);
            if (!/завтра|послезавтра/i.test(lower) && targetDate.getTime() < now.getTime()) {
              targetDate.setDate(targetDate.getDate() + 1);
            }
            hasTime = true;
          }
        }

        if (hasTime) dueAt = targetDate.toISOString();

        // 3. Классификация
        const taskKeywords = /(напомни|позвонить|написать|сделать|отправить|купить|скинуть|встреча|дедлайн|оплатить|сдать)/i;
        const ideaKeywords = /(идея|стартап|концепт|проект|мысль|придумал)/i;

        if (dueAt || taskKeywords.test(lower)) {
          detectedType = 'task';
        } else if (ideaKeywords.test(lower)) {
          detectedType = 'idea';
        }

        let title = text.replace(/#[\p{L}0-9_-]+/gu, '').trim();
        if (title.length > 70) title = title.substring(0, 70) + '...';

        return {
          id: 'ab_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          rawText: text,
          title: title || 'Без названия',
          type: detectedType,
          dueAt: dueAt,
          tags: tags,
          status: 'pending',
          nagCount: 0,
          createdAt: now.toISOString()
        };
      }

      // --- AUDIO ALARM ---
      function playTone() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(650, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(950, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
      }

      function checkAlarms() {
        const now = Date.now();
        notes.forEach(note => {
          if (note.type === 'task' && note.status === 'pending' && note.dueAt) {
            const dueTime = new Date(note.dueAt).getTime();
            if (now >= dueTime) {
              const lastNag = note.lastNagAt ? new Date(note.lastNagAt).getTime() : 0;
              if (!note.lastNagAt || (now - lastNag >= 300000)) {
                note.lastNagAt = new Date().toISOString();
                note.nagCount = (note.nagCount || 0) + 1;
                playTone();
                if (Notification.permission === 'granted') {
                  new Notification(`🚨 ДЕДЛАЙН: ${note.title}`, {
                    body: 'Сделай или отметь выполненным в Active Brain!',
                    tag: note.id
                  });
                }
                saveNotes();
              }
            }
          }
        });
      }

      // --- SPEECH RECOGNITION ---
      function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          micBtn.style.opacity = '0.4';
          micBtn.title = 'Голосовой ввод недоступен в этом браузере';
          return;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.interimResults = true;
        recognition.onstart = () => {
          isRecording = true;
          micBtn.classList.add('bg-neonPink', 'text-white');
        };
        recognition.onresult = (e) => {
          let str = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            str += e.results[i][0].transcript;
          }
          thoughtInput.value = str;
          updatePreview();
        };
        recognition.onerror = () => stopSpeech();
        recognition.onend = () => stopSpeech();
      }

      function stopSpeech() {
        isRecording = false;
        micBtn.classList.remove('bg-neonPink', 'text-white');
      }

      // --- RENDERING HELPERS ---
      function formatCountdown(dueIso) {
        const diff = new Date(dueIso).getTime() - Date.now();
        if (diff <= 0) {
          const over = Math.floor(Math.abs(diff) / 60000);
          return `<span class="text-neonPink font-bold">ПРОСРОЧЕНО (${over}м)</span>`;
        }
        const hours = Math.floor(diff / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        if (hours > 24) return `<span class="text-amber-500 font-medium">через ${Math.floor(hours/24)} дн.</span>`;
        return `<span class="text-neonCyan font-mono font-bold">${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</span>`;
      }

      function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t));
      }

      function renderCard(note) {
        const card = document.createElement('div');
        const isOverdue = note.dueAt && new Date(note.dueAt).getTime() <= Date.now() && note.status === 'pending';
        card.className = `glass-panel rounded-xl p-4 transition border ${
          isOverdue ? 'border-neonPink shadow-[0_0_15px_rgba(244,63,94,0.25)]' : 'border-slate-200 dark:border-surfaceBorder hover:border-slate-400 dark:hover:border-slate-700'
        }`;

        const tagsHtml = (note.tags || []).map(t => 
          `<span class="px-2 py-0.5 rounded-full text-[11px] bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-mono">${t}</span>`
        ).join('');

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded ${
                  note.type === 'task' ? 'bg-cyan-100 dark:bg-cyan-950 text-cyan-800 dark:text-neonCyan border border-cyan-300 dark:border-cyan-800/50' : 'bg-pink-100 dark:bg-pink-950 text-pink-700 dark:text-neonPink border border-pink-300 dark:border-pink-800/50'
                }">${note.type}</span>
                ${note.dueAt && note.status === 'pending' ? `<span class="text-xs" data-due="${note.dueAt}">${formatCountdown(note.dueAt)}</span>` : ''}
                ${note.nagCount > 0 && note.status === 'pending' ? `<span class="text-[10px] bg-red-100 dark:bg-red-950 text-rose-700 dark:text-neonPink px-1.5 py-0.2 rounded font-bold">Сигналов: ${note.nagCount}</span>` : ''}
              </div>
              <p class="text-sm sm:text-base font-medium text-slate-900 dark:text-slate-100 ${note.status === 'done' ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(note.rawText)}</p>
              <div class="flex flex-wrap gap-1 mt-2.5 items-center">
                ${tagsHtml}
                <span class="text-[10px] text-slate-400 font-mono ml-auto">${new Date(note.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
              </div>
            </div>
            <div class="flex flex-col gap-2">
              ${note.type === 'task' ? `
                <button data-action="toggle" data-id="${note.id}" class="w-8 h-8 rounded-lg flex items-center justify-center transition ${
                  note.status === 'done' ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 border border-emerald-500' : 'bg-slate-200 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-emerald-500 border border-slate-300 dark:border-slate-700'
                }" title="Выполнено">✓</button>
              ` : ''}
              <button data-action="delete" data-id="${note.id}" class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-slate-500 hover:text-neonPink border border-slate-300 dark:border-slate-700 transition" title="Удалить">✕</button>
            </div>
          </div>
        `;
        return card;
      }

      function render() {
        const pendingTasks = notes.filter(n => n.type === 'task' && n.status === 'pending');
        urgentBadge.textContent = pendingTasks.length;
        allBadge.textContent = notes.length;

        // 1. Рендер вкладки "Срочно"
        urgentContainer.innerHTML = '';
        const sortedUrgent = [...pendingTasks].sort((a,b) => (a.dueAt ? new Date(a.dueAt) : Infinity) - (b.dueAt ? new Date(b.dueAt) : Infinity));
        sortedUrgent.forEach(n => urgentContainer.appendChild(renderCard(n)));

        // 2. Рендер вкладки "Все мысли" с учетом поиска и чипа-тега
        ideasContainer.innerHTML = '';
        const query = (searchInput.value || '').trim().toLowerCase();
        
        const filteredAll = notes.filter(n => {
          const matchQuery = !query || n.rawText.toLowerCase().includes(query) || (n.tags || []).some(t => t.toLowerCase().includes(query));
          const matchTag = !activeTagFilter || (n.tags || []).includes(activeTagFilter);
          return matchQuery && matchTag;
        });

        filteredAll.forEach(n => ideasContainer.appendChild(renderCard(n)));

        // Управление показом пустого состояния (Empty State)
        if (currentTab === 'urgent') {
          emptyState.classList.toggle('hidden', sortedUrgent.length > 0);
        } else {
          emptyState.classList.toggle('hidden', filteredAll.length > 0);
        }

        renderTags();
      }

      function renderTags() {
        const allTags = [...new Set(notes.flatMap(n => n.tags || []))];
        tagsList.innerHTML = '';
        if (!allTags.length) return;

        const allBtn = document.createElement('button');
        allBtn.className = `px-2.5 py-1 rounded-full text-xs font-mono transition ${
          !activeTagFilter ? 'bg-neonCyan text-black font-bold shadow-[0_0_8px_rgba(6,182,212,0.4)]' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
        }`;
        allBtn.textContent = '#все';
        allBtn.onclick = () => { activeTagFilter = null; render(); };
        tagsList.appendChild(allBtn);

        allTags.forEach(tag => {
          const btn = document.createElement('button');
          btn.className = `px-2.5 py-1 rounded-full text-xs font-mono transition ${
            activeTagFilter === tag ? 'bg-neonCyan text-black font-bold shadow-[0_0_8px_rgba(6,182,212,0.4)]' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
          }`;
          btn.textContent = tag;
          btn.onclick = () => {
            activeTagFilter = (activeTagFilter === tag) ? null : tag;
            render();
          };
          tagsList.appendChild(btn);
        });
      }

      function updatePreview() {
        const parsed = parseContent(thoughtInput.value);
        if (!parsed) {
          parsePreview.classList.add('hidden');
          return;
        }
        parsePreview.classList.remove('hidden');
        previewType.textContent = parsed.type === 'task' ? '⚡ Задача' : '💡 Идея';
        if (parsed.dueAt) {
          previewDate.textContent = `⏰ ${new Date(parsed.dueAt).toLocaleString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}`;
        } else {
          previewDate.textContent = '';
        }
        previewTags.textContent = (parsed.tags || []).join(' ');
      }

      function handleSave() {
        const parsed = parseContent(thoughtInput.value);
        if (!parsed) return;
        notes.unshift(parsed);
        saveNotes();
        thoughtInput.value = '';
        parsePreview.classList.add('hidden');
        if (parsed.type === 'task') switchTab('urgent');
      }

      function switchTab(tab) {
        currentTab = tab;
        if (tab === 'urgent') {
          tabUrgent.classList.add('border-neonPink', 'text-neonPink');
          tabUrgent.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
          tabAll.classList.remove('border-neonCyan', 'text-neonCyan');
          tabAll.classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
          urgentContainer.classList.remove('hidden');
          ideasContainer.classList.add('hidden');
        } else {
          tabAll.classList.add('border-neonCyan', 'text-neonCyan');
          tabAll.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
          tabUrgent.classList.remove('border-neonPink', 'text-neonPink');
          tabUrgent.classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
          urgentContainer.classList.add('hidden');
          ideasContainer.classList.remove('hidden');
        }
        render();
      }

      // --- EVENTS ---
      document.addEventListener('click', (e) => {
        // Онбординг-клики по шаблонам
        const presetBtn = e.target.closest('.preset-btn');
        if (presetBtn) {
          const sample = presetBtn.dataset.sample;
          thoughtInput.value = sample;
          updatePreview();
          thoughtInput.focus();
          return;
        }

        // Действия над карточками
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.dataset.action === 'delete') {
          notes = notes.filter(n => n.id !== btn.dataset.id);
          saveNotes();
        } else if (btn.dataset.action === 'toggle') {
          const item = notes.find(n => n.id === btn.dataset.id);
          if (item) {
            item.status = item.status === 'done' ? 'pending' : 'done';
            saveNotes();
          }
        }
      });

      saveBtn.addEventListener('click', handleSave);
      thoughtInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          handleSave();
        }
      });
      thoughtInput.addEventListener('input', updatePreview);

      micBtn.addEventListener('click', () => {
        if (!recognition) return;
        isRecording ? recognition.stop() : recognition.start();
      });

      tabUrgent.addEventListener('click', () => switchTab('urgent'));
      tabAll.addEventListener('click', () => switchTab('all'));
      searchInput.addEventListener('input', render);

      notifyBtn.addEventListener('click', async () => {
        if (!('Notification' in window)) return;
        const p = await Notification.requestPermission();
        if (p === 'granted') {
          notifyDot.className = 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#10b981]';
          notifyStatus.textContent = 'Оповещения вкл';
          new Notification('Active Brain', { body: 'Уведомления активированы!' });
        }
      });

      exportBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `active_brain_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      });

      importInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (Array.isArray(parsed)) {
              notes = parsed;
              saveNotes();
            }
          } catch(err) {
            alert('Неверный формат JSON файла.');
          }
        };
        reader.readAsText(file);
      });

      // Инициализация
      initTheme();
      loadNotes();
      initSpeech();
      render();

      setInterval(() => {
        checkAlarms();
        document.querySelectorAll('[data-due]').forEach(el => {
          el.innerHTML = formatCountdown(el.dataset.due);
        });
      }, 1000);
    })();
  </script>
</body>
</html>
